const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
}
async function open(pw) {
  const key = await derive(pw);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(ENC.iv) }, key, b64(ENC.ct));
  const html = new TextDecoder().decode(pt);
  try { sessionStorage.setItem("sj_pw", pw); } catch(e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  document.getElementById("err").textContent = "";
  try { await open(pw); }
  catch(err) { document.getElementById("err").textContent = "비밀번호가 올바르지 않아요"; }
});
try {
  const saved = sessionStorage.getItem("sj_pw");
  if (saved) open(saved).catch(() => sessionStorage.removeItem("sj_pw"));
} catch(e) {}
