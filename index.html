<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>대시보드</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f9f9f7; color:#0b0b0b;
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  @media (prefers-color-scheme: dark) { body { background:#0d0d0d; color:#fff; }
    .box { background:#1a1a19 !important; border-color:rgba(255,255,255,.1) !important; }
    input { background:#0d0d0d !important; color:#fff !important; border-color:rgba(255,255,255,.15) !important; } }
  .box { background:#fcfcfb; border:1px solid rgba(11,11,11,.1); border-radius:14px;
    padding:34px 36px; width:320px; text-align:center; }
  h1 { font-size:17px; margin:0 0 4px; }
  p { font-size:12.5px; color:#898781; margin:0 0 18px; }
  input { width:100%; box-sizing:border-box; font-size:15px; padding:10px 12px;
    border:1px solid rgba(11,11,11,.18); border-radius:9px; outline:none; text-align:center; }
  button { margin-top:12px; width:100%; padding:10px; font-size:14px; font-weight:600;
    border:none; border-radius:9px; background:#0b0b0b; color:#fff; cursor:pointer; }
  .err { color:#d03b3b; font-size:12.5px; margin-top:10px; min-height:16px; }
  .rm { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:12px;
    font-size:12px; color:#898781; cursor:pointer; user-select:none; }
  .rm input { width:auto; margin:0; }
  .hint { font-size:11px; color:#a9a7a1; margin:10px 0 0; line-height:1.5; }
</style>
</head>
<body>
<form class="box" id="f">
  <h1>대시보드</h1>
  <p>비밀번호를 입력하세요</p>
  <input type="password" id="pw" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" autofocus>
  <label class="rm"><input type="checkbox" id="remember"> 이 기기에서 30일 동안 기억</label>
  <button type="submit">열기</button>
  <div class="err" id="err"></div>
  <p class="hint" id="hint">기억해 두면 이 기기에 비밀번호가 저장돼요.<br>지우려면 주소 끝에 <b>#forget</b> 을 붙여 여세요.</p>
</form>

const LS_KEY = "sj_lock";                       // 이 기기 기억 (메인·로그가 같이 씀)
const DAYS = 30;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const forget = () => { try { localStorage.removeItem(LS_KEY); sessionStorage.removeItem("sj_pw"); } catch(e) {} };
async function derive(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
}
async function open(pw, remember) {
  const key = await derive(pw);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(ENC.iv) }, key, b64(ENC.ct));
  const html = new TextDecoder().decode(pt);
  try { sessionStorage.setItem("sj_pw", pw); } catch(e) {}
  if (remember === true) {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ pw, exp: Date.now() + DAYS*864e5 })); } catch(e) {}
  } else if (remember === false) { forget(); }
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const rm = document.getElementById("remember").checked;
  document.getElementById("err").textContent = "";
  try { await open(pw, rm); }
  catch(err) { document.getElementById("err").textContent = "비밀번호가 올바르지 않아요"; }
});
/* 주소에 #forget 이 있으면 기억을 지우고 다시 묻는다 */
if (/forget/i.test(location.hash + location.search)) {
  forget();
  document.getElementById("hint").innerHTML = "이 기기의 기억을 지웠어요. 비밀번호를 다시 입력해 주세요.";
} else {
  let auto = null;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.pw && o.exp > Date.now()) auto = o.pw; else forget(); }
    if (!auto) auto = sessionStorage.getItem("sj_pw");
  } catch(e) {}
  if (auto) open(auto).catch(() => forget());     // 파일이 바뀌어 안 열리면 기억을 지우고 물어본다
}
