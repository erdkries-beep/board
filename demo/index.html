<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>대시보드</title>
<style>
  :root { color-scheme: light; --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --muted:#898781; --border:rgba(11,11,11,.1); }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#0d0d0d; --surface:#1a1a19; --ink:#fff; --muted:#8f8d87; --border:rgba(255,255,255,.12); } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  /* 잠금 */
  #lock { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:34px 36px; width:320px; text-align:center; }
  .box h1 { font-size:17px; margin:0 0 4px; }
  .box p { font-size:12.5px; color:var(--muted); margin:0 0 18px; }
  .box input { width:100%; font-size:15px; padding:10px 12px; border:1px solid var(--border); border-radius:9px; outline:none; text-align:center; background:var(--bg); color:var(--ink); }
  .box button { margin-top:12px; width:100%; padding:10px; font-size:14px; font-weight:600; border:none; border-radius:9px; background:var(--ink); color:var(--surface); cursor:pointer; }
  /* 앱 */
  #app { display:none; height:100vh; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--surface); }
  header h1 { font-size:19px; margin:0; font-weight:700; letter-spacing:-.2px; }
  .tagd { font-size:11px; font-weight:600; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:2px 8px; }
  nav { display:flex; gap:2px; background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px; flex-wrap:wrap; }
  nav button { border:none; background:transparent; color:var(--muted); border-radius:999px; padding:5px 13px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit; }
  nav button[aria-pressed="true"] { background:var(--ink); color:var(--surface); }
  iframe { flex:1; width:100%; border:0; display:none; }
  iframe.on { display:block; }
  @media (max-width:640px) { header { padding:8px 12px; gap:8px; } header h1 { font-size:16px; } nav button { padding:5px 9px; font-size:12px; } }
</style>
</head>
<body>
<div id="lock">
  <form class="box" id="f">
    <h1>대시보드</h1>
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="pw" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" autofocus>
    <button type="submit">열기</button>
  </form>
</div>
<div id="app">
  <header>
    <h1>투자 대시보드</h1><span class="tagd">DEMO · 가상 데이터</span>
    <nav id="nav"><button type="button" aria-pressed="true">장투</button><button type="button" aria-pressed="false">자산 전체</button><button type="button" aria-pressed="false">주문표</button><button type="button" aria-pressed="false">체결내역</button><button type="button" aria-pressed="false">입출금·배당</button><button type="button" aria-pressed="false">로그</button><button type="button" aria-pressed="false">스케쥴</button></nav>
  </header>
  <iframe id="fm" title="장투·자산"></iframe>
  <iframe id="fl" title="주문표·로그"></iframe>
</div>

const TABS = [["m", "sj"], ["m", "all"], ["l", "ord"], ["l", "fill"], ["l", "flow"], ["l", "log"], ["l", "sched"]];
let started = false;
function boot() {
  if (started) return; started = true;
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "flex";
  const dec = s => decodeURIComponent(escape(atob(s)));
  document.getElementById("fm").srcdoc = dec(SRC.m);
  document.getElementById("fl").srcdoc = dec(SRC.l);
  show(0);
}
function show(i) {
  const [frame, view] = TABS[i];
  document.querySelectorAll("#nav button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
  const fm = document.getElementById("fm"), fl = document.getElementById("fl");
  fm.classList.toggle("on", frame === "m");
  fl.classList.toggle("on", frame === "l");
  const f = frame === "m" ? fm : fl;
  const send = () => { try { f.contentWindow.postMessage({ view }, "*"); } catch (e) {} };
  send(); setTimeout(send, 400); setTimeout(send, 1200);
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); boot(); });
document.querySelectorAll("#nav button").forEach((b, i) => b.addEventListener("click", () => show(i)));
</script>
